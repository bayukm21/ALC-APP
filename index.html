<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Madinah KLC Personal Task Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel untuk kompilasi JSX di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide-react@0.292.0/dist/umd/lucide-react.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    
    // Mengekstrak ikon dari library Lucide
    const IconLib = window.lucideReact || window.lucide;
    const {
      LayoutDashboard, Users, Award, Megaphone, Database, Plus, Search,
      Download, RefreshCw, ExternalLink, Edit, Trash2, X, CheckSquare,
      ListTodo, Sparkles, Save, Settings, Eye, QrCode, Link: LinkIcon
    } = IconLib;

    // --- INITIAL MOCK DATA ---
    const INITIAL_TASKS = [
      { id: 'TASK-01', title: 'Silabus Robotik Early Kids Level 1-3', category: 'Kurikulum & Silabus', status: 'On Progress', docLink: 'https://drive.google.com/file/d/silabus-robotik-1', note: 'Revisi materi bab 3 & penyesuaian hardware kit' },
      { id: 'TASK-02', title: 'Draft Laporan Hasil Pembelajaran Robotik Early Kids', category: 'Administrasi Murid', status: 'Selesai', docLink: 'https://drive.google.com/file/d/draft-laporan-01', note: 'Sudah dikompilasi dan siap diarsipkan' },
      { id: 'TASK-03', title: 'Form Pendaftaran Murid Baru 2025', category: 'Administrasi Murid', status: 'Belum Dimulai', docLink: 'https://drive.google.com/file/d/form-pendaftaran', note: 'Perlu update tarif paket & opsi program baru' },
      { id: 'TASK-04', title: 'Modul Coding Python & AI Teens 2025', category: 'Modul Ajar', status: 'Revisi', docLink: 'https://drive.google.com/file/d/modul-python', note: 'Penambahan studi kasus ChatGPT API' }
    ];

    const INITIAL_STUDENTS = [
      { id: 'M-001', name: 'Kenneth Lido', school: 'SMP Katolik Mater Inviolata', schedule: 'Sabtu | 12.00 - 13.00 WIB', classLevel: 'Teens - Beginner', service: 'Online - Coding', program: 'Python Programming', status: 'Aktif', reportLink: 'https://drive.google.com/file/d/laporan-kenneth' },
      { id: 'M-002', name: 'Muhammad Fayadhi Abrar', school: 'SD IT Al-Madinah', schedule: 'Sabtu | 10.00 - 11.00 WIB', classLevel: 'Teens - Beginner', service: 'Offline - Coding', program: 'Python Programming', status: 'Aktif', reportLink: 'https://drive.google.com/file/d/laporan-fayadhi' },
      { id: 'M-003', name: 'Kevin Maulana Khamilin', school: 'SMP 1', schedule: 'Minggu | 09.00 - 10.00 WIB', classLevel: 'Kids - Beginner', service: 'Offline', program: 'Scratch', status: 'Aktif', reportLink: 'https://drive.google.com/file/d/laporan-kevin' }
    ];

    const INITIAL_CERTIFICATES = [
      { id: 'CERT-101', studentName: 'Kevin Maulana Khamilin', title: 'Sertifikat Scratch Beginner Class of the Teens Coding & AI Course', issueDate: '2025-01-15', status: 'Diterbitkan', certLink: 'https://drive.google.com/file/d/sertifikat-kevin' },
      { id: 'CERT-102', studentName: 'Muhammad Azka Abbas', title: 'Sertifikat Scratch Beginner Class of the Teens Coding & AI Course', issueDate: '2025-02-10', status: 'Diterbitkan', certLink: 'https://drive.google.com/file/d/sertifikat-azka' }
    ];

    const INITIAL_CAMPAIGNS = [
      { id: 'CAMP-01', name: 'Diskon Pendaftaran Semester Baru', channel: 'Media Sosial (IG/FB)', target: 20, budget: 1500000, roi: '+120%', status: 'Berjalan' },
      { id: 'CAMP-02', name: 'Workshop Coding Gratis Sekolah Dasar', channel: 'Event Direct / Roadshow', target: 50, budget: 2500000, roi: 'Planning', status: 'Rencana' }
    ];

    const INITIAL_DROPDOWN_OPTIONS = {
      services: ['Online - Coding', 'Offline - Coding', 'Offline', 'Online', 'Private Home Visit'],
      levels: ['Kids - Beginner', 'Kids - Intermediate', 'Teens - Beginner', 'Teens - Advanced', 'Early Kids']
    };

    function App() {
      // Main States (with LocalStorage initial fallbacks)
      const [activeTab, setActiveTab] = useState('tasks');
      const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('amd_tasks')) || INITIAL_TASKS);
      const [students, setStudents] = useState(() => JSON.parse(localStorage.getItem('amd_students')) || INITIAL_STUDENTS);
      const [certificates, setCertificates] = useState(() => JSON.parse(localStorage.getItem('amd_certs')) || INITIAL_CERTIFICATES);
      const [campaigns, setCampaigns] = useState(() => JSON.parse(localStorage.getItem('amd_campaigns')) || INITIAL_CAMPAIGNS);
      const [dropdownOptions, setDropdownOptions] = useState(() => JSON.parse(localStorage.getItem('amd_dropdowns')) || INITIAL_DROPDOWN_OPTIONS);

      // Sync state & LocalStorage Save Effects
      useEffect(() => { localStorage.setItem('amd_tasks', JSON.stringify(tasks)); }, [tasks]);
      useEffect(() => { localStorage.setItem('amd_students', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('amd_certs', JSON.stringify(certificates)); }, [certificates]);
      useEffect(() => { localStorage.setItem('amd_campaigns', JSON.stringify(campaigns)); }, [campaigns]);
      useEffect(() => { localStorage.setItem('amd_dropdowns', JSON.stringify(dropdownOptions)); }, [dropdownOptions]);

      // Google Sheets Config
      const [sheetConfig, setSheetConfig] = useState({
        spreadsheetId: '1BxiMVs0XRA5nFMdKbBUI6yU1N3z_AlMadinah_Personal',
        webAppUrl: 'https://script.google.com/macros/s/AKfycbz_AlMadinah_Personal_API/exec',
        lastSync: 'Baru saja'
      });
      const [isSyncing, setIsSyncing] = useState(false);

      // Search & Filter
      const [searchTerm, setSearchTerm] = useState('');
      const [filterStatus, setFilterStatus] = useState('All');

      // Modals
      const [modalOpen, setModalOpen] = useState(false);
      const [modalMode, setModalMode] = useState('add');
      const [modalType, setModalType] = useState('task');
      const [formData, setFormData] = useState({});

      // Options Manager Modal
      const [optionsModalOpen, setOptionsModalOpen] = useState(false);
      const [newServiceInput, setNewServiceInput] = useState('');
      const [newLevelInput, setNewLevelInput] = useState('');

      // Certificate Preview Modal
      const [previewCert, setPreviewCert] = useState(null);

      // Trigger simulated sync to Google Sheets
      const triggerSheetsSync = () => {
        setIsSyncing(true);
        setTimeout(() => {
          setIsSyncing(false);
          const now = new Date();
          setSheetConfig(prev => ({
            ...prev,
            lastSync: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
          }));
        }, 800);
      };

      // --- STATS COMPUTATION ---
      const stats = useMemo(() => {
        const completedTasks = tasks.filter(t => t.status === 'Selesai').length;
        const activeStudents = students.filter(s => s.status === 'Aktif').length;
        const totalCerts = certificates.length;
        const activeCampaigns = campaigns.filter(c => c.status === 'Berjalan').length;
        const progressPercent = tasks.length > 0 ? Math.round((completedTasks / tasks.length) * 100) : 0;
        return { completedTasks, totalTasks: tasks.length, activeStudents, totalCerts, activeCampaigns, progressPercent };
      }, [tasks, students, certificates, campaigns]);

      // --- CRUD HANDLERS ---
      const handleOpenAdd = (type) => {
        setModalMode('add');
        setModalType(type);
        if (type === 'student') {
          setFormData({
            service: dropdownOptions.services[0] || 'Online - Coding',
            classLevel: dropdownOptions.levels[0] || 'Teens - Beginner',
            status: 'Aktif'
          });
        } else {
          setFormData({});
        }
        setModalOpen(true);
      };

      const handleOpenEdit = (type, item) => {
        setModalMode('edit');
        setModalType(type);
        setFormData({ ...item });
        setModalOpen(true);
      };

      const handleDelete = (type, id) => {
        if (type === 'task') setTasks(tasks.filter(t => t.id !== id));
        if (type === 'student') setStudents(students.filter(s => s.id !== id));
        if (type === 'cert') setCertificates(certificates.filter(c => c.id !== id));
        if (type === 'campaign') setCampaigns(campaigns.filter(c => c.id !== id));
        triggerSheetsSync();
      };

      const handleSaveForm = (e) => {
        e.preventDefault();
        if (modalType === 'task') {
          if (modalMode === 'add') {
            const newObj = {
              id: `TASK-0${tasks.length + 1}`,
              title: formData.title || 'Pekerjaan Baru',
              category: formData.category || 'Administrasi',
              status: formData.status || 'Belum Dimulai',
              docLink: formData.docLink || '',
              note: formData.note || '-'
            };
            setTasks([newObj, ...tasks]);
          } else {
            setTasks(tasks.map(t => (t.id === formData.id ? { ...formData } : t)));
          }
        } else if (modalType === 'student') {
          if (modalMode === 'add') {
            const newObj = {
              id: `M-00${students.length + 1}`,
              name: formData.name || 'Murid Baru',
              school: formData.school || '-',
              schedule: formData.schedule || 'Sabtu | 10.00 WIB',
              classLevel: formData.classLevel || dropdownOptions.levels[0] || 'Kids - Beginner',
              service: formData.service || dropdownOptions.services[0] || 'Offline',
              program: formData.program || 'Scratch',
              status: formData.status || 'Aktif',
              reportLink: formData.reportLink || ''
            };
            setStudents([newObj, ...students]);
          } else {
            setStudents(students.map(s => (s.id === formData.id ? { ...formData } : s)));
          }
        } else if (modalType === 'cert') {
          if (modalMode === 'add') {
            const newObj = {
              id: `CERT-10${certificates.length + 1}`,
              studentName: formData.studentName || 'Nama Murid',
              title: formData.title || 'Sertifikat Kelulusan',
              issueDate: formData.issueDate || new Date().toISOString().split('T')[0],
              status: formData.status || 'Diterbitkan',
              certLink: formData.certLink || ''
            };
            setCertificates([newObj, ...certificates]);
          } else {
            setCertificates(certificates.map(c => (c.id === formData.id ? { ...formData } : c)));
          }
        } else if (modalType === 'campaign') {
          if (modalMode === 'add') {
            const newObj = {
              id: `CAMP-0${campaigns.length + 1}`,
              name: formData.name || 'Campaign Baru',
              channel: formData.channel || 'Media Sosial',
              target: Number(formData.target) || 20,
              budget: Number(formData.budget) || 1000000,
              roi: formData.roi || 'Planning',
              status: formData.status || 'Rencana'
            };
            setCampaigns([newObj, ...campaigns]);
          } else {
            setCampaigns(campaigns.map(c => (c.id === formData.id ? { ...formData } : c)));
          }
        }

        setModalOpen(false);
        triggerSheetsSync();
      };

      const handleQuickStatusChange = (taskId, newStatus) => {
        setTasks(tasks.map(t => (t.id === taskId ? { ...t, status: newStatus } : t)));
        triggerSheetsSync();
      };

      const handleAddOption = (type) => {
        if (type === 'service' && newServiceInput.trim()) {
          if (!dropdownOptions.services.includes(newServiceInput.trim())) {
            setDropdownOptions(prev => ({ ...prev, services: [...prev.services, newServiceInput.trim()] }));
          }
          setNewServiceInput('');
        } else if (type === 'level' && newLevelInput.trim()) {
          if (!dropdownOptions.levels.includes(newLevelInput.trim())) {
            setDropdownOptions(prev => ({ ...prev, levels: [...prev.levels, newLevelInput.trim()] }));
          }
          setNewLevelInput('');
        }
      };

      const handleDeleteOption = (type, value) => {
        if (type === 'service') {
          setDropdownOptions(prev => ({ ...prev, services: prev.services.filter(s => s !== value) }));
        } else if (type === 'level') {
          setDropdownOptions(prev => ({ ...prev, levels: prev.levels.filter(l => l !== value) }));
        }
      };

      const handleExportJSON = () => {
        const fullData = { tasks, students, certificates, campaigns, dropdownOptions, sheetConfig };
        const blob = new Blob([JSON.stringify(fullData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `AlMadinah_Personal_Backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      return (
        <div className="flex h-screen bg-slate-50 font-sans text-slate-800 overflow-hidden">
          {/* --- SIDEBAR NAVIGATION --- */}
          <aside className="w-64 bg-slate-900 text-white flex flex-col justify-between shadow-xl z-20 flex-shrink-0">
            <div>
              <div className="p-5 border-b border-slate-800 flex items-center space-x-3 bg-slate-950/60">
                <div className="bg-emerald-500 text-slate-950 p-2.5 rounded-xl font-bold shadow-lg flex items-center justify-center">
                  <Sparkles className="w-5 h-5 text-slate-950" />
                </div>
                <div>
                  <h1 className="font-bold text-sm leading-tight text-emerald-400">Al-Madinah KLC</h1>
                  <p className="text-[11px] text-slate-400 tracking-wide font-medium">Personal Task Hub</p>
                </div>
              </div>

              <nav className="p-4 space-y-1.5 text-xs font-semibold">
                <button onClick={() => setActiveTab('tasks')} className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition-all ${activeTab === 'tasks' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800/80'}`}>
                  <ListTodo className="w-4 h-4 text-emerald-300" />
                  <div className="flex-1 text-left flex justify-between items-center">
                    <span>Task & Dokumen Hub</span>
                    <span className="bg-slate-950 text-emerald-400 text-[10px] px-2 py-0.5 rounded-full font-bold">{tasks.length}</span>
                  </div>
                </button>
                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800/80'}`}>
                  <LayoutDashboard className="w-4 h-4 text-emerald-300" />
                  <span>Ringkasan Dashboard</span>
                </button>
                <button onClick={() => setActiveTab('students')} className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition-all ${activeTab === 'students' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800/80'}`}>
                  <Users className="w-4 h-4 text-emerald-300" />
                  <div className="flex-1 text-left flex justify-between items-center">
                    <span>Data Murid Kursus</span>
                    <span className="bg-slate-950 text-emerald-400 text-[10px] px-2 py-0.5 rounded-full font-bold">{students.length}</span>
                  </div>
                </button>
                <button onClick={() => setActiveTab('certificates')} className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition-all ${activeTab === 'certificates' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800/80'}`}>
                  <Award className="w-4 h-4 text-emerald-300" />
                  <span>Sertifikat Murid</span>
                </button>
                <button onClick={() => setActiveTab('campaigns')} className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition-all ${activeTab === 'campaigns' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800/80'}`}>
                  <Megaphone className="w-4 h-4 text-emerald-300" />
                  <span>Promosi & Plan</span>
                </button>
                <div className="pt-4 pb-1">
                  <p className="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Integrasi Database</p>
                </div>
                <button onClick={() => setActiveTab('sheets')} className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition-all ${activeTab === 'sheets' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800/80'}`}>
                  <Database className="w-4 h-4 text-emerald-300" />
                  <span>Google Sheets API</span>
                </button>
              </nav>
            </div>

            <div className="p-4 border-t border-slate-800 bg-slate-950/80">
              <div className="flex items-center justify-between text-xs text-slate-300 mb-1.5">
                <span className="flex items-center space-x-1.5 text-[11px] font-medium">
                  <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-ping' : 'bg-emerald-400'}`}></span>
                  <span>Sheets Sync Status</span>
                </span>
                <button onClick={triggerSheetsSync} className="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white transition" title="Sync Now">
                  <RefreshCw className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin text-amber-400' : ''}`} />
                </button>
              </div>
              <p className="text-[10px] text-slate-400 truncate">Last Sync: {sheetConfig.lastSync}</p>
            </div>
          </aside>

          {/* --- MAIN CONTENT AREA --- */}
          <main className="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50">
            <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between z-10 shadow-sm flex-shrink-0">
              <div className="flex items-center space-x-3">
                <h2 className="text-lg font-bold text-slate-800">
                  {activeTab === 'tasks' && 'Daftar Pekerjaan & Dokumen Administrasi (Personal Task Hub)'}
                  {activeTab === 'dashboard' && 'Ringkasan & Stats Produktivitas'}
                  {activeTab === 'students' && 'Manajemen & Database Murid Kursus'}
                  {activeTab === 'certificates' && 'Laporan & Penerbitan Sertifikat'}
                  {activeTab === 'campaigns' && 'Rencana & Tracking Promosi'}
                  {activeTab === 'sheets' && 'Konfigurasi Google Sheets Database API'}
                </h2>
              </div>
              <div className="flex items-center space-x-2">
                <button onClick={handleExportJSON} className="flex items-center space-x-1.5 text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-300 px-3 py-2 rounded-xl transition">
                  <Download className="w-3.5 h-3.5" />
                  <span>Backup Data (JSON)</span>
                </button>
                <button onClick={triggerSheetsSync} className="flex items-center space-x-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl shadow-sm transition">
                  <RefreshCw className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin' : ''}`} />
                  <span>Sync Sheets</span>
                </button>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto p-6 space-y-6">
              {activeTab === 'tasks' && (
                <div className="space-y-4">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold text-slate-700">Progres Kelengkapan Pekerjaan</span>
                      <span className="text-xs font-extrabold text-emerald-600">{stats.progressPercent}% Selesai</span>
                    </div>
                    <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                      <div className="bg-emerald-500 h-full transition-all duration-500" style={{ width: `${stats.progressPercent}%` }}></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                      <p className="text-[11px] font-bold text-slate-400 uppercase">Total Pekerjaan</p>
                      <p className="text-2xl font-extrabold text-slate-800">{stats.totalTasks}</p>
                    </div>
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                      <p className="text-[11px] font-bold text-emerald-600 uppercase">Selesai</p>
                      <p className="text-2xl font-extrabold text-emerald-600">{stats.completedTasks}</p>
                    </div>
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                      <p className="text-[11px] font-bold text-amber-600 uppercase">Dalam Proses / Revisi</p>
                      <p className="text-2xl font-extrabold text-amber-600">{tasks.filter(t => t.status === 'On Progress' || t.status === 'Revisi').length}</p>
                    </div>
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                      <p className="text-[11px] font-bold text-slate-500 uppercase">Belum Dimulai</p>
                      <p className="text-2xl font-extrabold text-slate-600">{tasks.filter(t => t.status === 'Belum Dimulai').length}</p>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div className="flex flex-1 items-center space-x-3">
                      <div className="relative flex-1 max-w-md">
                        <Search className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" />
                        <input type="text" placeholder="Cari judul pekerjaan..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                      </div>
                      <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-semibold">
                        <option value="All">Semua Status</option>
                        <option value="Selesai">Selesai</option>
                        <option value="On Progress">On Progress</option>
                        <option value="Revisi">Revisi</option>
                        <option value="Belum Dimulai">Belum Dimulai</option>
                      </select>
                    </div>
                    <button onClick={() => handleOpenAdd('task')} className="flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm transition">
                      <Plus className="w-4 h-4" />
                      <span>Tambah Pekerjaan / Dokumen</span>
                    </button>
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-50/80 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                          <th className="p-4">Nama Pekerjaan / Dokumen</th>
                          <th className="p-4">Kategori</th>
                          <th className="p-4">Status Pengerjaan</th>
                          <th className="p-4">Link Dokumen</th>
                          <th className="p-4">Catatan / Detail</th>
                          <th className="p-4 text-right">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 text-xs font-medium">
                        {tasks.filter(t => (filterStatus === 'All' || t.status === filterStatus) && t.title.toLowerCase().includes(searchTerm.toLowerCase())).map((task) => (
                          <tr key={task.id} className="hover:bg-slate-50/60 transition">
                            <td className="p-4 font-bold text-slate-800">
                              <div>{task.title}</div>
                              <div className="text-[10px] font-mono text-slate-400">{task.id}</div>
                            </td>

                      <div><label className="block font-bold text-slate-700 mb-1">Nama Murid</label><input required type="text" value={formData.studentName || ''} onChange={(e) => setFormData({ ...formData, studentName: e.target.value })} className="w-full border rounded-xl p-2.5" /></div>
                      <div><label className="block font-bold text-slate-700 mb-1">Judul Sertifikat</label><input required type="text" value={formData.title || ''} onChange={(e) => setFormData({ ...formData, title: e.target.value })} className="w-full border rounded-xl p-2.5" /></div>
                      <div><label className="block font-bold text-slate-700 mb-1">Link Sertifikat (URL)</label><input type="url" value={formData.certLink || ''} onChange={(e) => setFormData({ ...formData, certLink: e.target.value })} className="w-full border rounded-xl p-2.5 font-mono" /></div>
                      <div className="grid grid-cols-2 gap-3">
                        <div><label className="block font-bold text-slate-700 mb-1">Tanggal Terbit</label><input type="date" value={formData.issueDate || ''} onChange={(e) => setFormData({ ...formData, issueDate: e.target.value })} className="w-full border rounded-xl p-2.5" /></div>
                        <div><label className="block font-bold text-slate-700 mb-1">Status</label><select value={formData.status || 'Diterbitkan'} onChange={(e) => setFormData({ ...formData, status: e.target.value })} className="w-full border rounded-xl p-2.5"><option value="Diterbitkan">Diterbitkan</option><option value="Proses">Proses</option><option value="Draft">Draft</option></select></div>
                      </div>
                    </>
                  )}
                  {modalType === 'campaign' && (
                    <>
                      <div><label className="block font-bold text-slate-700 mb-1">Nama Campaign</label><input required type="text" value={formData.name || ''} onChange={(e) => setFormData({ ...formData, name: e.target.value })} className="w-full border rounded-xl p-2.5" /></div>
                      <div className="grid grid-cols-2 gap-3">
                        <div><label className="block font-bold text-slate-700 mb-1">Saluran</label><input type="text" value={formData.channel || ''} onChange={(e) => setFormData({ ...formData, channel: e.target.value })} className="w-full border rounded-xl p-2.5" /></div>
                        <div><label className="block font-bold text-slate-700 mb-1">Status</label><select value={formData.status || 'Rencana'} onChange={(e) => setFormData({ ...formData, status: e.target.value })} className="w-full border rounded-xl p-2.5"><option value="Rencana">Rencana</option><option value="Berjalan">Berjalan</option><option value="Evaluasi">Evaluasi</option><option value="Selesai">Selesai</option></select></div>
                      </div>
                    </>
                  )}
                  <div className="pt-3 border-t flex justify-end space-x-2">
                    <button type="button" onClick={() => setModalOpen(false)} className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold">Batal</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow-sm flex items-center space-x-1"><Save className="w-4 h-4" /><span>Simpan Perubahan</span></button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ==================== CERTIFICATE PREVIEW MODAL ==================== */}
          {previewCert && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full overflow-hidden">
                <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                  <h3 className="font-bold text-slate-800 text-sm">Pratinjau Sertifikat</h3>
                  <button onClick={() => setPreviewCert(null)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
                </div>
                <div className="p-8 text-center space-y-6 bg-slate-50/50 border-8 border-slate-100 m-4 rounded-xl">
                  <div className="space-y-1">
                    <p className="text-xs font-bold text-emerald-600 tracking-widest uppercase">Al-Madinah Kids Learning Center</p>
                    <h2 className="text-2xl font-extrabold text-slate-900 font-serif">CERTIFICATE OF COMPLETION</h2>
                    <p className="text-xs text-slate-500">Diberikan secara resmi kepada:</p>
                  </div>
                  <div className="border-b-2 border-emerald-500 pb-2 max-w-xs mx-auto"><p className="text-xl font-bold text-slate-800">{previewCert.studentName}</p></div>
                  <p className="text-xs text-slate-600 leading-relaxed max-w-md mx-auto">Atas keberhasilan dalam menyelesaikan program:<br /><span className="font-bold text-slate-800 text-sm mt-1 block">{previewCert.title}</span></p>
                  <div className="pt-4 flex items-center justify-between border-t border-slate-200 text-left max-w-md mx-auto">
                    <div><p className="text-[10px] text-slate-400 uppercase font-bold">Tanggal Terbit</p><p className="text-xs font-bold text-slate-700">{previewCert.issueDate}</p></div>
                    <div className="flex items-center space-x-2 bg-white p-2 rounded-lg border border-slate-200 shadow-sm"><QrCode className="w-8 h-8 text-slate-800" /><div className="text-[9px] text-slate-500"><p className="font-bold">Verified Digital</p></div></div>
                  </div>
                </div>
                <div className="p-4 border-t bg-slate-50 flex justify-end"><button onClick={() => setPreviewCert(null)} className="bg-slate-800 text-white text-xs font-semibold px-4 py-2 rounded-xl">Tutup</button></div>
              </div>
            </div>
          )}

          {/* ==================== OPTIONS MANAGER MODAL ==================== */}
          {optionsModalOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-lg w-full overflow-hidden">
                <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                  <div className="flex items-center space-x-2"><Settings className="w-4 h-4 text-emerald-600" /><h3 className="font-bold text-slate-800 text-sm">Kelola Opsi Dropdown</h3></div>
                  <button onClick={() => setOptionsModalOpen(false)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
                </div>
                <div className="p-5 space-y-6 text-xs max-h-[75vh] overflow-y-auto">
                  <div className="space-y-2">
                    <label className="block font-bold text-slate-800">Opsi Layanan</label>
                    <div className="flex space-x-2"><input type="text" value={newServiceInput} onChange={(e) => setNewServiceInput(e.target.value)} className="flex-1 border border-slate-200 rounded-xl p-2" /><button onClick={() => handleAddOption('service')} className="bg-emerald-600 text-white px-3 py-2 rounded-xl">Tambah</button></div>
                    <div className="flex flex-wrap gap-1.5 pt-2">{dropdownOptions.services.map(srv => <span key={srv} className="bg-slate-100 px-2.5 py-1 rounded-lg flex items-center space-x-1.5"><span>{srv}</span><button onClick={() => handleDeleteOption('service', srv)} className="text-slate-400 hover:text-rose-600"><X className="w-3 h-3" /></button></span>)}</div>
                  </div>
                </div>
                <div className="p-4 border-t bg-slate-50 flex justify-end"><button onClick={() => setOptionsModalOpen(false)} className="bg-slate-800 text-white text-xs font-semibold px-4 py-2 rounded-xl">Selesai</button></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
